<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Minha Bíblia em Atividades</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<!-- Meta Pixel -->


<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','1723902288771399');fbq('track','PageView');
const VALOR='5,00';const PRODUTO='Atividades Biblicas';const FUNNEL='Atividades Biblicas';
const DELIV_URL='https://drive.google.com/drive/folders/1I2k48ROiiHve3usTAIhY36-DdI0RHDFU?usp=drive_link';const DELIV_NAME='Acessar atividades';
const BUMPS=[];
let paymentId=null,pollTimer=null;
function parseBRL(v){return parseFloat(String(v).replace(',','.'))||0;}
function atualizarTotal(){
  let t=parseBRL(VALOR);
  BUMPS.forEach((_,i)=>{if(document.getElementById('bumpchk'+i)?.checked)t+=parseBRL(BUMPS[i].price);});
  const d=document.getElementById('totalDisplay');if(d)d.textContent='R$ '+t.toFixed(2).replace('.',',');
  const b=document.getElementById('payBtn');if(b)b.textContent='💚 Gerar PIX — R$ '+t.toFixed(2).replace('.',',');
}
function toggleBump(i){
  const chk=document.getElementById('bumpchk'+i);
  const card=document.getElementById('bump'+i);
  if(!chk)return;chk.checked=!chk.checked;
  if(card)card.classList.toggle('sel',chk.checked);
  atualizarTotal();
}
// delegação de clique nos bump cards
document.addEventListener('click',function(e){
  const card=e.target.closest('[id^="bump"]');
  if(card&&!/bumpchk/.test(card.id)){const i=card.id.replace('bump','');toggleBump(Number(i));}
});
async function iniciarPagamento(){
  const nome=document.getElementById('inNome')?.value.trim();
  const email=document.getElementById('inEmail')?.value.trim();
  const errEl=document.getElementById('formErr');
  if(errEl)errEl.textContent='';
  if(!nome){if(errEl)errEl.textContent='Informe seu nome';return;}
  if(!email||!email.includes('@')){if(errEl)errEl.textContent='Informe um e-mail válido';return;}
  let total=parseBRL(VALOR);
  const selBumps=BUMPS.filter((_,i)=>document.getElementById('bumpchk'+i)?.checked);
  selBumps.forEach(b=>total+=parseBRL(b.price));
  const btn=document.getElementById('payBtn');
  if(btn){btn.disabled=true;btn.textContent='Gerando PIX...';}
  try{
    const eid='initiate_checkout_'+Date.now();
    if(typeof fbq!=='undefined')fbq('track','InitiateCheckout',{currency:'BRL',value:total},{eventID:eid});
    const res=await fetch('/api/pagamento',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,nome,valor:total.toFixed(2).replace('.',','),produto:PRODUTO,
        funnel_id:FUNNEL||undefined,delivery_url:DELIV_URL||undefined,delivery_name:DELIV_NAME||undefined,
        bumps:selBumps.length?selBumps:undefined})});
    const data=await res.json();
    if(!res.ok||!data.qr_code)throw new Error(data.erro||'Erro ao gerar PIX');
    paymentId=data.id;
    const qi=document.getElementById('qrImg');if(qi)qi.src='data:image/png;base64,'+data.qr_code_base64;
    const pc=document.getElementById('pixCode');if(pc)pc.textContent=data.qr_code;
    const fc=document.getElementById('formCard');if(fc)fc.style.display='none';
    const pb=document.getElementById('pixBox');if(pb)pb.style.display='block';
    pollTimer=setInterval(verificarPagamento,4000);
  }catch(err){
    if(errEl)errEl.textContent=err.message;
    if(btn){btn.disabled=false;btn.textContent='💚 Gerar PIX';}
  }
}
async function verificarPagamento(){
  if(!paymentId)return;
  try{
    const r=await fetch('/api/status?id='+paymentId);const d=await r.json();
    if(d.status==='approved'){
      clearInterval(pollTimer);
      const pid='purchase_'+paymentId;
      const tv=document.getElementById('totalDisplay');
      const val=tv?parseFloat(tv.textContent.replace('R$ ','').replace(',','.')):parseBRL(VALOR);
      if(typeof fbq!=='undefined')fbq('track','Purchase',{currency:'BRL',value:val},{eventID:pid});
      const pb=document.getElementById('pixBox');if(pb)pb.style.display='none';
      const sb=document.getElementById('successBox');if(sb)sb.style.display='block';
    }
  }catch{}
}
function copiarPix(){
  const code=document.getElementById('pixCode')?.textContent||'';
  navigator.clipboard.writeText(code).then(()=>{
    const b=document.querySelector('[onclick="copiarPix()"]');
    if(b){b.textContent='✅ Copiado!';setTimeout(()=>b.textContent='📋 Copiar código PIX',2000);}
  }).catch(()=>{});
}
document.getElementById('payBtn')?.addEventListener('click',iniciarPagamento);
atualizarTotal();
</script>
</body>
</html>
